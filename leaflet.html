<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>US population density – Leaflet</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&family=Fraunces:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map"></div>
//banner 
<div class="card">
  <div class="title-block">
    <h1>Population density of the United States of America</h1>
    <div class="byline">Webmap by Pamela Lira</div>
  </div>
  <div class="legend-block">
    <div class="legend-title">People / mi²</div>
    <div class="legend-bar" id="legend-bar"></div>
    <div class="legend-ticks" id="legend-ticks"></div>
  </div>
  <div class="legend-city"><span class="dot"></span> City</div>
  <div class="readout" id="readout"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="stateData.js"></script>
<script>
  // ---------- 1. Fall palette + class breaks
  const BREAKS = [0, 10, 20, 50, 100, 200, 500, 1000];
  const COLORS = ['#FFF3D6', '#F9D98C', '#F2B544', '#E8892B',
                  '#CC5A1E', '#A23B17', '#722414', '#4A1A0E'];
  function getColor(d) {
    for (let i = BREAKS.length - 1; i >= 0; i--) if (d >= BREAKS[i]) return COLORS[i];
    return COLORS[0];
  }

  document.getElementById('legend-bar').innerHTML = COLORS.map(c => `<span style="background:${c}"></span>`).join('');
  document.getElementById('legend-ticks').innerHTML = BREAKS.map((b, i) => `<span>${i === BREAKS.length - 1 ? b + '+' : b}</span>`).join('');

  // hover readout inside the card
  const readout = document.getElementById('readout');
  function updateReadout(p) {
    readout.innerHTML = p
      ? `<div class="state">${p.name}</div><div class="value"><b>${p.density.toLocaleString('en-US')}</b> people / mi²</div>`
      : '';
  }
  updateReadout();

  //zoom
  const map = L.map('map', { zoomControl: false, zoomSnap: 0 });
  L.control.zoom({ position: 'bottomright' }).addTo(map);
  const US = [[24.5, -125], [49.5, -66.9]];
  const fitUS = () => map.fitBounds(US, { paddingTopLeft: [20, 130], paddingBottomRight: [20, 20] });
  fitUS();

  // basemap
  const ESRI = 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/';
  L.tileLayer(ESRI + 'World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 16, className: 'warm-base',
    attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ'
  }).addTo(map);

  // choropleth and labels
  map.createPane('labels');
  map.getPane('labels').style.zIndex = 650;
  map.getPane('labels').style.pointerEvents = 'none';
  STATE_LABELS.forEach(s => {
    const callout = s.tlng !== undefined;
    if (callout) L.polyline([[s.lat, s.lng], [s.tlat, s.tlng]], { pane: 'labels', color: '#3B2A1E', weight: 0.8, interactive: false }).addTo(map);
    const cls = callout ? 'off' : (s.dark ? 'dark' : '');
    L.marker(callout ? [s.tlat, s.tlng] : [s.lat, s.lng], {
      pane: 'labels', interactive: false,
      icon: L.divIcon({ className: '', iconSize: [0, 0], html: `<div class="state-label ${cls}">${s.text.replace('\n', '<br>')}</div>` })
    }).addTo(map);
  });

  // 
  const baseStyle = f => ({
    fillColor: getColor(f.properties.density), fillOpacity: 0.85,
    color: '#FBF6EC', weight: 1, opacity: 1
  });
  // statesData comes from stateData.js (a <script>, so it also works when you double-click the file)
  const statesLayer = L.geoJSON(statesData, {
    style: baseStyle,
    onEachFeature: (f, layer) => layer.on({
      mouseover: e => { e.target.setStyle({ weight: 3, color: '#3B2A1E' }); e.target.bringToFront(); updateReadout(f.properties); },
      mouseout: e => { statesLayer.resetStyle(e.target); updateReadout(); }
    })
  }).addTo(map);
  addCities();


</script>
</body>
</html>
